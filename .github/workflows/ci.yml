name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: apklab --help
      - run: apklab doctor --check

  android-tools:
    name: Android tool integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android tools from Ubuntu repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk-headless apktool aapt zipalign apksigner
      - name: Download and verify public test fixture
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/androguard/androguard/0c0af30ca6bd55d3d34aa10d7f32593cd091a483/tests/data/APK/TestActivity.apk \
            --output "$RUNNER_TEMP/apklab-test.apk"
          echo '3bb32dd50129690bce850124ea120aa334e708eaa7987cf2329fd1ea0467a0eb  '"$RUNNER_TEMP/apklab-test.apk" | sha256sum -c -
      - run: python -m pip install .
      - name: Run real-tool integration test
        env:
          APKLAB_INTEGRATION_APK: ${{ runner.temp }}/apklab-test.apk
        run: python -m unittest discover -s tests -p test_integration.py -v
