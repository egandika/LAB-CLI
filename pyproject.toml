[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apklab-cli"
version = "0.5.0"
description = "A cautious, general-purpose Android APK analysis CLI"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
apklab = "apklab.cli:main"

[tool.setuptools.packages.find]
include = ["apklab*"]
